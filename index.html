<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Multi-Voice Studio</title>
<!-- Google Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
:root { 
    --primary: #0ea5e9; 
    --primary-dark: #0284c7;
    --accent: #f59e0b;
    --bg: #0f172a; 
    --card-bg: #1e293b; 
    --text: #f1f5f9; 
    --text-muted: #94a3b8;
    --border: #334155; 
    --header-h: 60px;
    --footer-h: 70px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    height: 100vh; 
    display: flex; 
    flex-direction: column;
    overflow: hidden; 
}

/* --- Fixed Header --- */
header {
    height: var(--header-h);
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--primary);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
}

/* --- Scrollable Content Area --- */
.main-content {
    margin-top: var(--header-h);
    margin-bottom: var(--footer-h);
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    scroll-behavior: smooth;
    padding-bottom: 30px;
}

/* --- API Input (Hidden) --- */
.api-box { display: none; }

/* --- Segment Card Design --- */
.segment-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 25px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    position: relative;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
}
.card-title { font-weight: 600; color: var(--primary); font-size: 0.95rem; letter-spacing: 0.5px; }
.btn-delete {
    background: rgba(239, 68, 68, 0.1); border: none; color: #ef4444; 
    cursor: pointer; padding: 6px; border-radius: 8px;
    transition: background 0.2s;
}
.btn-delete:active { background: rgba(239, 68, 68, 0.3); }

/* Inputs */
label.inp-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; display: block; font-weight: 500; }

select {
    width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
    background: #0f172a; color: #fff; font-size: 0.95rem; outline: none; margin-bottom: 15px;
    appearance: none; /* Custom arrow look can be added here */
}

textarea {
    width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid var(--border); background: #0f172a; color: #e2e8f0;
    font-size: 1.05rem; outline: none; min-height: 130px; resize: vertical; line-height: 1.6;
    margin-bottom: 15px; font-family: inherit;
}
textarea:focus { border-color: var(--primary); }

/* Sliders */
.controls-row {
    display: flex; gap: 12px; margin-bottom: 18px;
}
.control-group {
    flex: 1; background: rgba(0,0,0,0.25); padding: 10px; border-radius: 10px; border: 1px solid #334155;
}
.control-label {
    display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px;
}
input[type=range] { width: 100%; accent-color: var(--primary); height: 4px; cursor: pointer; }

/* Action Buttons Area */
.action-area {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 5px;
}

/* Main Buttons */
.btn-gen {
    background: linear-gradient(135deg, #0ea5e9, #2563eb);
    color: white; border: none; padding: 16px; border-radius: 12px;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 1.05rem; letter-spacing: 0.5px;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
}
.btn-gen:active { transform: scale(0.98); }

/* Test Button (Now styled nicely below gen) */
.btn-test {
    background: #334155; 
    color: #fbbf24; /* Amber color for test */
    border: 1px solid #fbbf24;
    padding: 12px; border-radius: 12px;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 0.95rem;
    transition: all 0.2s;
}
.btn-test:active { background: #fbbf24; color: #000; }

.audio-wrapper { display: none; margin-top: 15px; background: #020617; padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
audio { width: 100%; height: 40px; border-radius: 20px; }

.btn-download {
    background: #16a34a; color: white; border: none; padding: 14px; border-radius: 12px;
    font-weight: 700; cursor: pointer; display: none; width: 100%; margin-top: 12px;
    align-items: center; justify-content: center; gap: 8px; font-size: 1rem;
}

/* --- Fixed Footer --- */
footer {
    height: var(--footer-h);
    background: #0f172a;
    border-top: 1px solid var(--border);
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
}

.fab-add {
    background: var(--text);
    color: var(--bg);
    border: none;
    padding: 14px 28px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
    transition: transform 0.2s;
}
.fab-add:active { transform: scale(0.95); }

/* Status Text inside card */
.status-txt { font-size: 0.85rem; text-align: center; margin: 5px 0; display: none; font-weight: 500; }

/* Spinner */
@keyframes spin { 100% { transform: rotate(360deg); } }
.animate-spin { animation: spin 1s linear infinite; }
</style>
</head>
<body>

<!-- Header Fixed -->
<header>
    <span class="material-icons-round" style="color:#fbbf24;">graphic_eq</span> 
    &nbsp;Pro Voice Studio
</header>

<!-- Scrollable Content -->
<div class="main-content" id="mainContainer">

    <div class="api-box">
        <input id="global-api-url" value="https://hindi-tts-3gjy.onrender.com" readonly>
    </div>

    <div id="segments-list"></div>
    
    <!-- Empty State -->
    <div id="empty-state" style="text-align:center; color:#64748b; margin-top:60px; display:none;">
        <span class="material-icons-round" style="font-size:3.5rem; opacity:0.3;">queue_music</span>
        <p style="margin-top:10px; font-size:1.1rem;">No scripts added.<br>Tap "+ Add Segment" below.</p>
    </div>

</div>

<!-- Footer Fixed -->
<footer>
    <button class="fab-add" onclick="addSegment()">
        <span class="material-icons-round">add</span> Add New Segment
    </button>
</footer>

<script>
    let segmentCount = 0;
    const globalApiUrl = document.getElementById("global-api-url");
    const segmentsList = document.getElementById("segments-list");
    const emptyState = document.getElementById("empty-state");

    // Updated Voice List - Added more models (Indian Urdu acts as Hindi Casual)
    const voiceOptions = `
        <optgroup label="📺 Hindi News & Documentary (Professional)">
            <option value="hi-male" selected>🇮🇳 Male: Madhur (Deep Voice/News)</option>
            <option value="hi-female">🇮🇳 Female: Swara (Standard News Anchor)</option>
        </optgroup>

        <optgroup label="🗣️ Hindi/Urdu Casual (Conversational)">
             <option value="ur-male">🇮🇳 Male: Salman (Casual Hindi Talk)</option>
             <option value="ur-female">🇮🇳 Female: Gulshan (Soft/Shayari)</option>
             <option value="hi-female-2">🇮🇳 Female: Noopur (Fast/Sharp)</option>
        </optgroup>
        
        <optgroup label="📖 Urdu/Hindi Storytelling (Heavy/Emotional)">
            <option value="ur-pk-male">🇵🇰 Male: Asad (Heavy/Poetic/Ghazal)</option>
            <option value="ur-pk-female">🇵🇰 Female: Uzma (Soft Story)</option>
        </optgroup>

        <optgroup label="🇬🇧 Hinglish (Indian English Accent)">
            <option value="en-in-female">🇮🇳 Female: Neerja (English Accent)</option>
            <option value="en-in-male">🇮🇳 Male: Prabhat (English Accent)</option>
        </optgroup>
    `;

    window.onload = () => { addSegment(); };

    function checkEmpty() {
        if (segmentsList.children.length === 0) emptyState.style.display = "block";
        else emptyState.style.display = "none";
    }

    function addSegment() {
        segmentCount++;
        const id = segmentCount;
        
        const div = document.createElement('div');
        div.className = 'segment-card';
        div.id = `seg-${id}`;
        
        div.innerHTML = `
            <div class="card-header">
                <span class="card-title">
                    <span class="material-icons-round" style="vertical-align:middle; font-size:1.1rem; color:#0ea5e9;">description</span> 
                    Script Segment #${id}
                </span>
                <button class="btn-delete" onclick="removeSegment(${id})" title="Delete">
                    <span class="material-icons-round">delete_outline</span>
                </button>
            </div>

            <label class="inp-label">Select Voice Model</label>
            <select id="voice-${id}">${voiceOptions}</select>

            <div class="controls-row">
                <div class="control-group">
                    <div class="control-label"><span>Speed</span> <span id="lbl-spd-${id}">0%</span></div>
                    <input type="range" id="rate-${id}" min="-50" max="50" value="0" oninput="updateLbl(${id})">
                </div>
                <div class="control-group">
                    <div class="control-label"><span>Pitch</span> <span id="lbl-pit-${id}">0Hz</span></div>
                    <input type="range" id="pitch-${id}" min="-20" max="20" value="0" oninput="updateLbl(${id})">
                </div>
            </div>

            <textarea id="text-${id}" placeholder="Type Hindi text here...&#10;For News Style: Use | for full stops and ... for pauses."></textarea>

            <div class="action-area">
                <!-- 1. Generate Button (Primary) -->
                <button class="btn-gen" id="btn-gen-${id}" onclick="generateAudio(${id})">
                    <span class="material-icons-round">multitrack_audio</span> Generate Audio
                </button>
                
                <div id="status-${id}" class="status-txt"></div>

                <!-- 2. Test Button (Secondary - Below Generate as requested) -->
                <button class="btn-test" id="btn-test-${id}" onclick="testVoice(${id})">
                    <span class="material-icons-round">play_circle_filled</span> Test Voice Sample
                </button>

                <!-- 3. Output Area -->
                <div class="audio-wrapper" id="audio-box-${id}">
                    <audio id="player-${id}" controls controlsList="nodownload"></audio>
                    <button class="btn-download" id="dl-${id}" onclick="downloadAudio(${id})">
                        <span class="material-icons-round">file_download</span> Download MP3
                    </button>
                </div>
            </div>
        `;
        
        segmentsList.appendChild(div);
        setTimeout(() => { div.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 100);
        checkEmpty();
    }

    function removeSegment(id) {
        if(confirm("Delete this block?")) {
            const el = document.getElementById(`seg-${id}`);
            if(el) el.remove();
            checkEmpty();
        }
    }

    function updateLbl(id) {
        const rate = document.getElementById(`rate-${id}`).value;
        const pitch = document.getElementById(`pitch-${id}`).value;
        document.getElementById(`lbl-spd-${id}`).innerText = (rate > 0 ? "+" : "") + rate + "%";
        document.getElementById(`lbl-pit-${id}`).innerText = (pitch > 0 ? "+" : "") + pitch + "Hz";
    }

    const audioBlobs = {};

    // --- Test Voice Function ---
    async function testVoice(id) {
        const voice = document.getElementById(`voice-${id}`).value;
        const btn = document.getElementById(`btn-test-${id}`);
        const originalText = btn.innerHTML;
        
        let testText = "नमस्ते, यह एक वॉयस टेस्ट है।";
        if(voice.includes("ur")) testText = "अस्सलाम वालेकुम, यह एक वॉयस चेक है।";
        if(voice.includes("en")) testText = "Hello, checking the voice quality.";

        // UI Loading
        btn.disabled = true;
        btn.innerHTML = '<span class="material-icons-round animate-spin">sync</span> Testing...';
        btn.style.opacity = "0.7";

        const baseUrl = globalApiUrl.value.replace(/\/$/, "");
        
        try {
            const res = await fetch(baseUrl + "/tts", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ text: testText, voice: voice, rate: 0, pitch: 0 })
            });
            if(!res.ok) throw new Error("API Error");
            const blob = await res.blob();
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();
        } catch(e) {
            alert("Test Failed: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
            btn.style.opacity = "1";
        }
    }

    // --- Generate Full Audio ---
    async function generateAudio(id) {
        const text = document.getElementById(`text-${id}`).value.trim();
        const voice = document.getElementById(`voice-${id}`).value;
        const rate = document.getElementById(`rate-${id}`).value;
        const pitch = document.getElementById(`pitch-${id}`).value;
        
        const btn = document.getElementById(`btn-gen-${id}`);
        const status = document.getElementById(`status-${id}`);
        const audioBox = document.getElementById(`audio-box-${id}`);
        const player = document.getElementById(`player-${id}`);
        const dlBtn = document.getElementById(`dl-${id}`);

        if(!text) { alert("Please enter text first!"); return; }

        btn.disabled = true;
        btn.innerHTML = '<span class="material-icons-round animate-spin">sync</span> Processing...';
        status.style.display = "block";
        status.innerText = "Connecting to server...";
        status.style.color = "#fbbf24";
        audioBox.style.display = "none";

        const baseUrl = globalApiUrl.value.replace(/\/$/, "");
        
        try {
            const res = await fetch(baseUrl + "/tts", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ text, voice, rate, pitch })
            });

            if(!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || "Server error");
            }

            const blob = await res.blob();
            audioBlobs[id] = blob;
            
            const url = URL.createObjectURL(blob);
            player.src = url;
            
            status.innerText = "✅ Generated Successfully!";
            status.style.color = "#4ade80";
            
            audioBox.style.display = "block";
            dlBtn.style.display = "flex";
            
            player.play().catch(e => console.log("Auto-play blocked"));

        } catch(e) {
            status.innerText = "❌ Error: " + e.message;
            status.style.color = "#ef4444";
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<span class="material-icons-round">multitrack_audio</span> Generate Audio';
        }
    }

    function downloadAudio(id) {
        if(!audioBlobs[id]) return;
        const voiceName = document.getElementById(`voice-${id}`).value;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(audioBlobs[id]);
        a.download = `Audio_${id}_${voiceName}.mp3`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }
</script>

</body>
</html>
